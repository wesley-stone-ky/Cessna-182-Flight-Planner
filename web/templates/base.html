<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Can you fly this weekend?{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/">Weekend Flying</a>
  <nav class="nav">
    {% if user %}
      <a href="/home">This weekend</a><a href="/settings">Settings</a>
      <form method="post" action="/logout"><button class="linkbtn" type="submit">Sign out</button></form>
    {% else %}
      <a href="/login">Sign in</a>
    {% endif %}
  </nav>
</div></header>
<main>
{% block main %}{% endblock %}
</main>
<footer>
  <p class="disclaimer">{{ disclaimer }}</p>
  <p><a href="/terms">Terms and privacy</a></p>
</footer>
</body>
</html>
