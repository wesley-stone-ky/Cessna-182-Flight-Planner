name: Refresh FAA fuel data

on:
  schedule:
    # Mondays 12:00 UTC. The FAA publishes a new airport data cycle every 28 days;
    # this only commits when something changed.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data/fuel.csv from FAA NASR
        run: python scripts/build_fuel_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/fuel.csv && git ls-files --error-unmatch data/fuel.csv >/dev/null 2>&1; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel.csv
          git commit -m "Refresh FAA fuel data"
          git push
