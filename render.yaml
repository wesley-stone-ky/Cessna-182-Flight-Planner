# Render Blueprint for the multi-user web app (Render dashboard -> New -> Blueprint -> this repo).
# Free plan: the service sleeps after ~15 idle minutes and takes ~30 s to wake. Fine for testers;
# use a paid instance before charging money. Dad's Streamlit app is unaffected.
services:
  - type: web
    name: weekend-flying
    runtime: python
    plan: free
    buildCommand: pip install -r web/requirements.txt
    startCommand: uvicorn web.app:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY          # signs sign-in links and cookies; copy it to the GitHub secret of the same name
        generateValue: true
      - key: DATABASE_URL        # Postgres connection string (e.g. a free Neon database)
        sync: false
      - key: BASE_URL            # e.g. https://weekend-flying.onrender.com (used in emailed links)
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
