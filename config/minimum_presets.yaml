# ---------------------------------------------------------------------------
# "How cautious are you?" presets for onboarding. Each overrides
# config/minimums.yaml. All stay well above the legal VFR floors
# (1,000 ft / 3 sm in controlled airspace, 14 CFR 91.155). A pilot can
# fine-tune any number afterwards.
# ---------------------------------------------------------------------------
cautious:
  label: Cautious
  blurb: Returning to flying, low recent hours, or flying with passengers who don't love bumps.
  airport_min_ceiling_ft_agl: 3000
  airport_min_vis_sm: 5
  max_crosswind_kt: 10
  max_surface_wind_kt: 20
  max_gust_kt: 20
  reserve_minutes: 60
standard:
  label: Standard
  blurb: Current and comfortable, flying regularly in your own airplane.
  airport_min_ceiling_ft_agl: 2500
  airport_min_vis_sm: 5
  max_crosswind_kt: 12
  max_surface_wind_kt: 25
  max_gust_kt: 25
  reserve_minutes: 60
experienced:
  label: Experienced
  blurb: High recent time, comfortable with gusty crosswinds and marginal ceilings.
  airport_min_ceiling_ft_agl: 2000
  airport_min_vis_sm: 3
  max_crosswind_kt: 15
  max_surface_wind_kt: 25
  max_gust_kt: 25
  reserve_minutes: 45
