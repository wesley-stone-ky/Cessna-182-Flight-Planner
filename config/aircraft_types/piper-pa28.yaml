# ---------------------------------------------------------------------------
# Piper PA-28 family: Cherokee, Warrior, Archer, Arrow
# ---------------------------------------------------------------------------
# TYPICAL planning numbers, deliberately on the slow / thirsty side of what
# owners report. NOT a substitute for the airplane's POH/AFM; `verified:
# false` makes the app say so. An owner's own numbers always win.
# Fuel: the app uses the SMALLEST `fuel_options` entry until the owner
# confirms their usable fuel. No weight & balance data yet for this family.
# Not included: PA-28-235/236 Dakota, turbo Arrows (PA-28RT-201T).
# ---------------------------------------------------------------------------
family: piper-pa28
make: Piper
faa_mfr: "^PIPER"

base:
  verified: false
  default_cruise_setting: "65%"
  climb_ktas: 80
  descent:
    fpm: 500
    gph: 6.5
    ktas_bonus: 5
  limits:
    max_demonstrated_crosswind_kt: 17
    service_ceiling_ft: 11000
    max_planning_alt_ft: 10500
  fuel:
    start_taxi_takeoff_gal: 1.5
  fuel_options:
    standard: {total_gal: 50, usable_gal: 48}

variants:
  "PA-28-140":
    name: Piper PA-28-140 Cherokee
    years: [1964, 1977]
    engine: Lycoming O-320-E2A, 150 hp
    faa_models: ["PA-28-140", "PA-28-150", "PA-28-160"]
    climb_ktas: 75
    climb_table:
      - {alt_ft: 0,     minutes: 0,  gal: 0.0, nm: 0}
      - {alt_ft: 2000,  minutes: 4,  gal: 0.8, nm: 5}
      - {alt_ft: 4000,  minutes: 8,  gal: 1.6, nm: 11}
      - {alt_ft: 6000,  minutes: 13, gal: 2.6, nm: 18}
      - {alt_ft: 8000,  minutes: 20, gal: 3.8, nm: 28}
      - {alt_ft: 10000, minutes: 30, gal: 5.5, nm: 43}
    cruise_settings:
      "75%":
        gph: 8.5
        ktas: {2000: 106, 4000: 108, 6000: 110, 8000: 111}
        max_alt_ft: 8000
      "65%":
        gph: 7.5
        ktas: {2000: 100, 4000: 102, 6000: 104, 8000: 105, 10000: 105}
        max_alt_ft: 10000
      "55%":
        gph: 6.5
        ktas: {2000: 92, 4000: 94, 6000: 96, 8000: 97, 10000: 97}
        max_alt_ft: 10000
    limits: {service_ceiling_ft: 10950}

