      - {alt_ft: 4000,  minutes: 5,  gal: 1.4, nm: 7}
      - {alt_ft: 6000,  minutes: 8,  gal: 2.1, nm: 11}
      - {alt_ft: 8000,  minutes: 12, gal: 2.9, nm: 17}
      - {alt_ft: 10000, minutes: 16, gal: 3.8, nm: 23}
      - {alt_ft: 12000, minutes: 22, gal: 4.9, nm: 32}
    descent: {gph: 6.5}
    cruise_settings:
      "75%":
        gph: 10.0
        ktas: {2000: 118, 4000: 121, 6000: 123, 8000: 125}
        max_alt_ft: 8000
      "65%":
        gph: 8.8
        ktas: {2000: 111, 4000: 114, 6000: 116, 8000: 118, 10000: 119}
        max_alt_ft: 10000
      "55%":
        gph: 7.6
        ktas: {2000: 103, 4000: 105, 6000: 107, 8000: 109, 10000: 110, 12000: 110}
        max_alt_ft: 12000
    limits: {service_ceiling_ft: 14000}
