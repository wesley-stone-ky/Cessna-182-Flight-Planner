# ---------------------------------------------------------------------------
# My airplane: 1985 Cessna 182R Skylane (Continental O-470-U, 230 hp)
# ---------------------------------------------------------------------------
# `type` picks the catalog entry in config/aircraft_types/ (performance,
# limits, CG envelope). Anything below overrides the catalog for THIS airplane.
#
# The catalog numbers are typical planning values, NOT a substitute for the
# airplane's POH/AFM. To tune them, copy a block from the catalog file here
# (e.g. cruise_settings or climb_table) and put in the numbers from your POH,
# Section 5, or what your 750Xi and fuel totalizer actually show.
# ---------------------------------------------------------------------------

type: cessna-182/182R

tail_number: "N____"          # your N-number (shows on exports)
model: "Cessna 182R (1985)"
avionics: "Garmin GTN 750Xi"
equipment_suffix: "/G"         # GPS/WAAS - used when filing (verify with your ADS-B setup)

fuel:
  # Owner-confirmed: 79 gal TOTAL capacity. Cessna's ~80-gal-total 182 tanks
  # carry 75 gal usable (5 gal unusable), so 75 is used here.
  # VERIFY: the fuel selector placard ("BOTH - xx GAL") gives the exact usable
  # number; change this line to match it.
  total_gal: 79
  usable_gal: 75
  start_taxi_takeoff_gal: 2.0   # VERIFY: POH "fuel allowance for engine start, taxi and takeoff"

# Weight & balance: limits, arms and the CG envelope come from the catalog
# (FAA TCDS 3A13, Model 182R). These two numbers are THIS airplane's, from its
# latest Weight & Balance record (includes unusable fuel and full oil).
weight_balance:
  empty_weight_lb: 1850        # EXAMPLE ONLY — replace with the airplane's W&B record
  empty_arm_in: 37.5           # EXAMPLE ONLY — empty CG (moment / weight)
  empty_is_example: true       # set to false once the two lines above are real
